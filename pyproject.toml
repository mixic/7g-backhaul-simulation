[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "7g-backhaul-simulation"
version = "0.1.0"
description = "Simulation of seamless multi-medium 7G transport and self-scaling content distribution"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Milan Nikolic" }]
license = "GPL-3.0-or-later"
dependencies = [
    "numpy>=1.24.0",
    "simpy>=4.0.0",
    "matplotlib>=3.7.0",
]

[tool.setuptools]
packages = ["backhaul_sim", "simulation"]
